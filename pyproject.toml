[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "governed-rag"
version = "0.1.0"
description = "Evidence-grounded, evaluated and governable agentic RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ana Camila Bernardes" }]
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "truststore>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/governed_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["governed_rag"]
